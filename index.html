<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Интерактивная викторина</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section class="quiz-card" id="quiz-screen">
      <div class="top-row">
        <p class="question-counter" id="question-counter">Вопрос 1 из 10</p>
        <p class="score" id="score">Баллы: 0</p>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <h1 id="question-title">Загрузка вопроса...</h1>
      <div class="answers" id="answers"></div>

      <button class="next-btn" id="next-btn" disabled>Следующий вопрос</button>
    </section>

    <section class="result-card hidden" id="result-screen">
      <h2>Результаты</h2>
      <p class="final-score" id="final-score"></p>
      <p class="result-message" id="result-message"></p>
      <button class="restart-btn" id="restart-btn">Начать заново</button>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
